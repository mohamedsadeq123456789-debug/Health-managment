<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login - Vitalyze</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">Vitalyze</div>
      <div class="small">No account? <a href="register.html">Register</a></div>
    </div>

    <div class="card">
      <h2>Login</h2>
      <p>Access your vitals, reports, and child guidance.</p>

      <label>Email</label>
      <input id="email" type="email" placeholder="name@email.com"/>

      <label>Password</label>
      <input id="password" type="password" placeholder="your password"/>

      <div class="row" style="margin-top:14px;">
        <button class="btn" id="btnLogin">Login</button>
        <button class="btn secondary" onclick="window.location.href='index.html'">Back To Home</button>
      </div>

      <div class="hr"></div>
      <div id="msg" class="small"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
  

  document.getElementById('btnLogin').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      return swalInfo('Missing data', 'Please enter email and password.');
    }

    swalLoading('Logging in...');
    try {
      const data = await api('/api/auth/login', {
        method: 'POST',
        body: { email, password }
      });
      setToken(data.token);
      swalClose();
      await swalOk('Welcome', 'Login successful.');
      window.location.href = 'dashboard.html';
    } catch (e) {
      swalClose();
      swalError('Login failed', e.message);
    }
  };
  </script>
</body>
</html>
