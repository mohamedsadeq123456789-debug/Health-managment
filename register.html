<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register - Vitalyze</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">Vitalyze</div>
      <div class="small">Already have an account? <a href="login.html">Login</a></div>
    </div>

    <div class="card">
      <h2>Create Account</h2>
      <p>Minimal registration to start saving vitals and generating reports.</p>

      <label>Full Name</label>
      <input id="fullName" placeholder="Your name"/>

      <label>Email</label>
      <input id="email" type="email" placeholder="name@email.com"/>

      <label>Password</label>
      <input id="password" type="password" placeholder="min 6 chars"/>

      <div class="row" style="margin-top:14px;">
        <button class="btn" id="btnRegister">Register</button>
        <button class="btn secondary" onclick="window.location.href='login.html'">Back</button>
      </div>

      <div class="hr"></div>
      <div id="msg" class="small"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    

  document.getElementById('btnRegister').onclick = async () => {
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!fullName || !email || !password) {
      return swalInfo('Missing data', 'Please fill full name, email, and password.');
    }

    swalLoading('Creating account...');
    try {
      const data = await api('/api/auth/register', {
        method: 'POST',
        body: { fullName, email, password }
      });
      setToken(data.token);
      swalClose();
      await swalOk('Account created', 'You can now use the dashboard.');
      window.location.href = 'dashboard.html';
    } catch (e) {
      swalClose();
      swalError('Register failed', e.message);
    }
  };
  </script>
</body>
</html>
